[workspace]
members = [
    "nlzsz-core",
    "nsz",
    "nrz",
    "nlzsz",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["nlzsz contributors"]
license = "MIT"
description = "A Rust implementation of nlzsz, similar to lrzsz (rz/sz), and compatible with tmux"

[workspace.dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
md5 = "0.7"
flate2 = "1.0"
zstd = "0.13"
base64 = "0.21"
tempfile = "3.10"
console = "0.15"
indicatif = "0.17"
glob = "0.3"
walkdir = "2"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
regex = "1.10"
dirs = "5.0"
libc = "0.2"
nlzsz-core = { path = "nlzsz-core" }